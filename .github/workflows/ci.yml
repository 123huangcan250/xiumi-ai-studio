name: CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm sample
      - run: pnpm e2e --update-snapshots=none
      - name: Editorial shell dark and responsive scenarios
        run: pnpm exec playwright test --config playwright.shell.config.ts --update-snapshots=none
        env:
          SHELL_PHASE: 'after'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
            test-results-shell/
            visual-evidence/editorial-shell/
          retention-days: 7
